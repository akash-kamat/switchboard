name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: go test ./...
      - run: go vet ./...
      - run: node --check internal/server/web/app.js
      - name: Check package scripts
        run: shellcheck packaging/scripts/*.sh

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: arm
            goarm: "7"
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Cross-compile
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: go build -trimpath ./cmd/switchboard

  linux-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build snapshot release
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.12.7
          args: release --snapshot --clean
      - name: Inspect package matrix
        run: |
          test "$(find release-dist -maxdepth 1 -name '*.deb' | wc -l)" -eq 3
          test "$(find release-dist -maxdepth 1 -name '*.rpm' | wc -l)" -eq 3
          test "$(find release-dist -maxdepth 1 -name '*.pkg.tar.zst' | wc -l)" -eq 3
          test -s release-dist/checksums.txt
          deb=$(find release-dist -maxdepth 1 -name '*linux_amd64.deb' -print -quit)
          dpkg-deb --contents "$deb" | grep /usr/bin/switchboard
          dpkg-deb --contents "$deb" | grep /etc/switchboard/config.yaml
          test "$(dpkg-deb --field "$deb" Architecture)" = amd64
      - name: Test Debian package lifecycle
        run: |
          set -eu
          deb=$(find release-dist -maxdepth 1 -name '*linux_amd64.deb' -print -quit)

          sudo dpkg -i "$deb"
          test -x /usr/bin/switchboard
          id switchboard
          test "$(sudo stat -c '%U:%G:%a' /etc/switchboard/config.yaml)" = root:switchboard:660
          test "$(sudo stat -c '%U:%G:%a' /var/lib/switchboard)" = switchboard:switchboard:750

          printf '\n# lifecycle-test\n' | sudo tee -a /etc/switchboard/config.yaml >/dev/null
          config_hash=$(sudo sha256sum /etc/switchboard/config.yaml | cut -d ' ' -f 1)
          sudo dpkg -i "$deb"
          test "$(sudo sha256sum /etc/switchboard/config.yaml | cut -d ' ' -f 1)" = "$config_hash"

          cp "$deb" /tmp/switchboard-broken.deb
          truncate -s 128 /tmp/switchboard-broken.deb
          if sudo dpkg -i /tmp/switchboard-broken.deb; then
            echo "corrupt package unexpectedly installed" >&2
            exit 1
          fi
          test -x /usr/bin/switchboard
          test "$(sudo sha256sum /etc/switchboard/config.yaml | cut -d ' ' -f 1)" = "$config_hash"

          sudo dpkg --remove switchboard
          test ! -e /usr/bin/switchboard
          sudo test -f /etc/switchboard/config.yaml
          sudo test -d /var/lib/switchboard

          sudo dpkg -i "$deb"
          test -x /usr/bin/switchboard
          test "$(sudo sha256sum /etc/switchboard/config.yaml | cut -d ' ' -f 1)" = "$config_hash"
      - name: Upload snapshot artifacts
        uses: actions/upload-artifact@v4
        with:
          name: switchboard-snapshot
          path: |
            release-dist/*.deb
            release-dist/*.rpm
            release-dist/*.pkg.tar.zst
            release-dist/*.tar.gz
            release-dist/*.zip
            release-dist/checksums.txt

  rpm-package-lifecycle:
    needs: linux-packages
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Download snapshot artifacts
        uses: actions/download-artifact@v5
        with:
          name: switchboard-snapshot
          path: release-dist
      - name: Test RPM package lifecycle
        run: |
          set -eu
          rpm_file=$(find release-dist -maxdepth 1 -name '*linux_amd64.rpm' -print -quit)

          dnf install -y "$rpm_file"
          test -x /usr/bin/switchboard
          id switchboard
          test "$(stat -c '%U:%G:%a' /etc/switchboard/config.yaml)" = root:switchboard:660

          printf '\n# rpm-lifecycle-test\n' >>/etc/switchboard/config.yaml
          config_hash=$(sha256sum /etc/switchboard/config.yaml | cut -d ' ' -f 1)
          rpm --upgrade --replacepkgs "$rpm_file"
          test "$(sha256sum /etc/switchboard/config.yaml | cut -d ' ' -f 1)" = "$config_hash"

          rpm --erase switchboard
          test ! -e /usr/bin/switchboard
          test -f /etc/switchboard/config.yaml
          test -d /var/lib/switchboard

          dnf install -y "$rpm_file"
          test -x /usr/bin/switchboard
          test "$(sha256sum /etc/switchboard/config.yaml | cut -d ' ' -f 1)" = "$config_hash"

  arch-package-lifecycle:
    needs: linux-packages
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Download snapshot artifacts
        uses: actions/download-artifact@v5
        with:
          name: switchboard-snapshot
          path: release-dist
      - name: Test Arch package lifecycle
        run: |
          set -eu
          package=$(find release-dist -maxdepth 1 -name '*linux_amd64.pkg.tar.zst' -print -quit)

          pacman -Sy --noconfirm
          pacman -U --noconfirm "$package"
          test -x /usr/bin/switchboard
          id switchboard
          test "$(stat -c '%U:%G:%a' /etc/switchboard/config.yaml)" = root:switchboard:660

          printf '\n# arch-lifecycle-test\n' >>/etc/switchboard/config.yaml
          config_hash=$(sha256sum /etc/switchboard/config.yaml | cut -d ' ' -f 1)
          pacman -U --noconfirm "$package"
          test "$(sha256sum /etc/switchboard/config.yaml | cut -d ' ' -f 1)" = "$config_hash"

          pacman -R --noconfirm switchboard
          test ! -e /usr/bin/switchboard
          test -f /etc/switchboard/config.yaml
          test -d /var/lib/switchboard

          pacman -U --noconfirm "$package"
          test -x /usr/bin/switchboard
          test "$(sha256sum /etc/switchboard/config.yaml | cut -d ' ' -f 1)" = "$config_hash"
