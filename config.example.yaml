# Bind to the LAN. Use 127.0.0.1:8080 when placing Switchboard behind a proxy.
listen: ":8080"

# These settings are also editable from the Settings page.
dashboard:
  refresh_seconds: 30
  theme: light
  background: "#4ec669"
  # Available: cpu, memory, storage, temperature, load, swap
  overview:
    - cpu
    - memory
    - storage
  # Available: hostname, local_ip, os, uptime, kernel, architecture
  system_details:
    - hostname
    - local_ip
    - os
    - uptime
    - kernel

services:
  - name: Transmission
    # Optional: auto, a bundled icon name, or an http/https image URL.
    icon: auto
    type: systemd
    unit: transmission-daemon.service
    href: http://192.168.1.102:9091/
    description: Torrent client
    group: Media

  - name: Jellyfin
    type: docker
    container: jellyfin
    href: http://192.168.1.102:8096/
    description: Movies, shows and music
    group: Media

  - name: Dockge
    type: docker
    container: dockge-dockge-1
    href: http://192.168.1.102:5001/
    description: Compose stack manager
    group: Dashboards

  - name: n8n
    type: docker
    container: n8n
    href: http://192.168.1.102:5678/
    description: Workflow automation
    group: Automation
