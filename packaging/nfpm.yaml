name: switchboard
arch: amd64
platform: linux
version: 0.1.0
section: admin
priority: optional
maintainer: Akash Kamat <akash-kamat@users.noreply.github.com>
description: Lightweight dashboard for system services and Docker containers
vendor: Switchboard
homepage: https://github.com/akash-kamat/switchboard
license: MIT

contents:
  - src: dist/switchboard-linux-amd64
    dst: /usr/bin/switchboard
    file_info:
      mode: 0755
      owner: root
      group: root
  - src: config.example.yaml
    dst: /etc/switchboard/config.yaml
    type: config|noreplace
    file_info:
      mode: 0660
      owner: root
      group: switchboard
  - src: deploy/switchboard.service
    dst: /usr/lib/systemd/system/switchboard.service
    file_info:
      mode: 0644
      owner: root
      group: root
  - dst: /var/lib/switchboard
    type: dir
    file_info:
      mode: 0750
      owner: switchboard
      group: switchboard

scripts:
  preinstall: packaging/scripts/preinstall.sh
  postinstall: packaging/scripts/postinstall.sh
  preremove: packaging/scripts/preremove.sh
  postremove: packaging/scripts/postremove.sh

overrides:
  deb:
    depends:
      - systemd
  rpm:
    depends:
      - systemd
