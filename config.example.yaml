# Configuration schema. Future releases will migrate older supported versions.
version: 1

# Bind to the LAN. If default port 8080 is busy, Switchboard selects and saves
# the first free port from 8081 through 8099. Custom ports fail on collision.
listen: ":8080"

# These settings are also editable from the Settings page.
dashboard:
  refresh_seconds: 30
  theme: light
  background: "#4ec669"
  # Available: cpu, memory, storage, temperature, load, swap
  overview:
    - cpu
    - memory
    - storage
  # Available: hostname, local_ip, os, uptime, kernel, architecture
  system_details:
    - hostname
    - local_ip
    - os
    - uptime
    - kernel

# Start clean. Add the services and containers that actually exist on this host
# from the dashboard or by editing this file.
services: []
