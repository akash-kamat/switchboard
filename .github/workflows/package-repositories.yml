name: Publish signed Linux repositories

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published tag, for example v1.2.3
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  repositories:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    env:
      GH_TOKEN: ${{ github.token }}
      SIGNING_KEY: ${{ secrets.PACKAGE_SIGNING_KEY }}
      SIGNING_PASSPHRASE: ${{ secrets.PACKAGE_SIGNING_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v7
      - name: Require protected signing material
        run: |
          test -n "$SIGNING_KEY" || { echo "PACKAGE_SIGNING_KEY is not configured" >&2; exit 1; }
          test -n "$SIGNING_PASSPHRASE" || { echo "PACKAGE_SIGNING_PASSPHRASE is not configured" >&2; exit 1; }
      - name: Install repository tools
        run: sudo apt-get update && sudo apt-get install -y reprepro createrepo-c
      - name: Import signing key and download packages
        run: |
          printf '%s' "$SIGNING_KEY" | base64 --decode | gpg --batch --import
          mkdir -p "$RUNNER_TEMP/packages"
          gh release download "${{ inputs.tag }}" --dir "$RUNNER_TEMP/packages" --pattern '*.deb' --pattern '*.rpm'
      - name: Build signed apt repository
        run: |
          mkdir -p public/apt/conf
          fingerprint=$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" {print $10; exit}')
          cat >public/apt/conf/distributions <<EOF
          Origin: Switchboard
          Label: Switchboard
          Codename: stable
          Architectures: amd64 arm64 armhf
          Components: main
          Description: Switchboard packages
          SignWith: $fingerprint
          EOF
          for package in "$RUNNER_TEMP"/packages/*.deb; do
            reprepro --basedir public/apt --ask-passphrase includedeb stable "$package"
          done
          gpg --armor --export "$fingerprint" >public/apt/switchboard-archive-keyring.asc
        env:
          REPREPRO_PASSPHRASE: ${{ secrets.PACKAGE_SIGNING_PASSPHRASE }}
      - name: Build signed rpm repository
        run: |
          mkdir -p public/rpm
          cp "$RUNNER_TEMP"/packages/*.rpm public/rpm/
          createrepo_c public/rpm
          printf '%s' "$SIGNING_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --armor --detach-sign public/rpm/repodata/repomd.xml
          fingerprint=$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" {print $10; exit}')
          gpg --armor --export "$fingerprint" >public/rpm/RPM-GPG-KEY-switchboard
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
      - uses: actions/deploy-pages@v5
